<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Inicio de Sesion</title>
    <link rel='stylesheet' href=''>
</head>
<body>
    <!--Logo Agrogest en Header-->
    <header>
        <div>
       <img src="AGROGEST-IMAGENES/LOGO.jpg" alt="Logo AgroGest" width="100" height="100">
       <h2>AgroGest</h2>
       <h3>Distribuciones</h3>
       </div> 
    </header>
    <!--Main principal de inicio de sesion 
        formulario email,contraseña, checbox recordar
        boton recordar contraseña-->
    <main>
        <form action="#" method="get">
                <legend>Bienvenido de Nuevo</legend>
                <p>Inicia sesion para acceder a tu portal AgroGest</p>

                <label for="email">Correo Electronico:</label>
                <input type="text" id="email" nombre="email" placeholder="ingresa tu correo electronico">
                <br><br>
                <label for="contraseña">Contraseña:</label>
                <input type="text" id="contraseña" nombre="contraseña" placeholder="ingresa tu contraseña">
                <br>
                <label for="recordar">recordarme:</label>
                <input type="checkbox" id="recordar" nombre="recordar">

                <button> <a href="recupera-tu-acceso.html"></a>¿Olvidaste tu contraseña?</button>
                <br>
                <button type="submit">Iniciar Sesión</button>
                <p>---------o-----------</p>
                <button>Ingrese sin Cuenta (Ver Catalogo)</button>
                <p>utilizamos medidas de seguridad para proteger tus datos</p>
                <strong>Tu informacion esta protegida</strong>
        </form>
        <div>
        <img src="AGROGEST-IMAGENES/IMAGEN CENTRAL INICIO SESION DORADO.png" alt="Inicio sesion dorado" width="500" height="500">
        
        </div>
    </main>
</body>
